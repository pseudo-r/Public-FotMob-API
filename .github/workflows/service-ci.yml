name: Service validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: fotmob_service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/service_test
      SECRET_KEY: ci-test-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" build
      - run: python -m ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m pytest -o addopts="" -q
      - run: python -m build --wheel
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t service-audit ./fotmob_service
      - run: docker run --rm -e DJANGO_SETTINGS_MODULE=config.settings.test -e SECRET_KEY=ci-test-only service-audit python manage.py check
